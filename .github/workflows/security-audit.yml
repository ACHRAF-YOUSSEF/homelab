name: Security audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

# Fork pull requests receive no deployment credentials or write permissions.
permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secrets in history and current files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts='--all --full-history' \
            --redact=100 --no-banner --no-color --verbose --exit-code=1

      - name: Scan current files with Gitleaks
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact=100 --no-banner --no-color --verbose --exit-code=1

  repository-policy:
    name: Repository privacy and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test privacy rules
        run: node --test .github/scripts/test_audit_repository.mjs

      - name: Enforce repository privacy rules
        if: ${{ !cancelled() }}
        run: node .github/scripts/audit_repository.mjs

      - name: Validate GitHub Actions workflows
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  subtitle-studio-rust:
    name: Subtitle Studio Rust checks and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
          build-warnings: ''
          cache: false

      - name: Check Rust formatting
        working-directory: subtitle-studio
        run: cargo fmt --all -- --check

      - name: Run Rust lint and tests with warnings denied
        working-directory: subtitle-studio
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

      - name: Install pinned RustSec audit tool
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit locked Rust dependencies
        working-directory: subtitle-studio
        run: cargo audit --file Cargo.lock --deny warnings

  subtitle-studio-cpu-runtime:
    name: Subtitle Studio CPU image health and CLI smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build CPU-only runtime image
        run: docker build --tag subtitle-studio-runtime:test subtitle-studio

      - name: Check isolated runtime and SRT validator without a model
        run: |
          docker run --detach --name subtitle-studio-runtime-test --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 1g --cpus 2 --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --tmpfs /data:rw,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /models:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /media:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /library:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700 \
            subtitle-studio-runtime:test
          trap 'docker rm --force subtitle-studio-runtime-test >/dev/null' EXIT
          ready=false
          for _ in {1..20}; do
            if docker exec subtitle-studio-runtime-test /usr/local/bin/subtitle-studio --healthcheck; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]
          docker exec -i subtitle-studio-runtime-test /bin/sh -c 'cat > /tmp/sample.srt' <<'SRT'
          1
          00:00:01,000 --> 00:00:02,000
          Hello.
          SRT
          docker exec subtitle-studio-runtime-test /usr/local/bin/subtitle-studio validate-srt /tmp/sample.srt

  jellyfin-counts-cache-rust:
    name: Jellyfin counts cache Rust checks and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
          build-warnings: ''
          cache: false

      - name: Check Rust formatting
        working-directory: glance/jellyfin-counts-cache
        run: cargo fmt --all -- --check

      - name: Lint and test cache with disposable HTTP fixtures
        working-directory: glance/jellyfin-counts-cache
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

      - name: Install pinned RustSec audit tool
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit locked Rust dependencies
        working-directory: glance/jellyfin-counts-cache
        run: cargo audit --file Cargo.lock --deny warnings

      - name: Build and check isolated unprivileged warming-up runtime
        run: |
          docker build --tag jellyfin-counts-cache-runtime:test glance/jellyfin-counts-cache
          docker run --detach --name jellyfin-counts-cache-runtime-test --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 64m --cpus 0.25 --pids-limit 32 \
            --env JELLYFIN_INTERNAL_URL=http://127.0.0.1:9090 \
            --env JELLYFIN_API_KEY=test-key jellyfin-counts-cache-runtime:test
          trap 'docker rm --force jellyfin-counts-cache-runtime-test >/dev/null' EXIT
          listening=false
          for _ in {1..15}; do
            if docker logs jellyfin-counts-cache-runtime-test 2>&1 | grep -q 'listening'; then
              listening=true
              break
            fi
            sleep 1
          done
          [ "$listening" = true ]
          [ "$(docker inspect --format '{{.State.Running}}' jellyfin-counts-cache-runtime-test)" = true ]
          # A live server with no upstream success must fail readiness.
          if docker exec jellyfin-counts-cache-runtime-test /usr/local/bin/jellyfin-counts-cache --healthcheck; then
            exit 1
          fi

  glance-live-rust:
    name: Glance live Rust checks and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
          build-warnings: ''
          cache: false

      - name: Check Rust formatting
        working-directory: glance/live
        run: cargo fmt --all -- --check

      - name: Lint and test gateway with disposable HTTP and WebSocket fixtures
        working-directory: glance/live
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked --features fixture-probe -- -D warnings
          cargo test --all-targets --locked --features fixture-probe

      - name: Install pinned RustSec audit tool
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit locked Rust dependencies
        working-directory: glance/live
        run: cargo audit --file Cargo.lock --deny warnings

      - name: Build and check the unprivileged runtime without network access
        run: |
          docker build --tag glance-live-runtime:test glance/live
          docker build --target probe --tag glance-live-probe:test glance/live
          docker run --detach --name glance-live-runtime-test --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 96m --cpus 0.50 --pids-limit 32 \
            --env GLANCE_UPSTREAM_URL=http://127.0.0.1:9090 \
            --env QBITTORRENT_INTERNAL_URL=http://127.0.0.1:9090 \
            --env JELLYFIN_INTERNAL_URL=http://127.0.0.1:9090 \
            --env JELLYFIN_API_KEY=test-key --env GLANCE_LIVE_JELLYFIN_WS=false \
            --env GLANCE_LIVE_JELLYFIN_INTERVAL=2 glance-live-runtime:test
          trap 'docker rm --force glance-live-runtime-test >/dev/null' EXIT
          ready=false
          for _ in {1..15}; do
            if docker exec glance-live-runtime-test /usr/local/bin/glance-live --healthcheck; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]
          docker run --rm --network container:glance-live-runtime-test --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 96m --cpus 0.50 --pids-limit 32 \
            glance-live-probe:test --seconds 10

  subforge-rust:
    name: Subforge Rust checks and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
          build-warnings: ''
          cache: false

      - name: Check Rust formatting
        working-directory: subforge
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path native-ocr/Cargo.toml -- --check

      - name: Run Rust lint and tests with warnings denied
        working-directory: subforge
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo clippy --locked --features smoke-tests --bin subforge-smoke -- -D warnings
          cargo check --locked --features smoke-tests --bin subforge-smoke
          cargo clippy --all-targets --locked --features cuda -- -D warnings
          cargo test --all-targets --locked --features cuda
          cargo clippy --locked --features 'cuda smoke-tests' --bin subforge-smoke -- -D warnings
          cargo check --locked --features 'cuda smoke-tests' --bin subforge-smoke

      - name: Install pinned RustSec audit tool
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit locked Rust dependencies
        working-directory: subforge
        run: |
          cargo audit --file Cargo.lock --deny warnings
          cargo audit --file native-ocr/Cargo.lock --deny warnings

  subtitle-conversion:
    name: Subtitle conversion with isolated media and OCR fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, lint, and test the standalone CPU OCR helper
        run: docker build --target native-ocr-build --tag subforge-native-ocr-build:test subforge

      - name: Build isolated Rust runtime test stage
        run: docker build --target test --tag subforge-test subforge

      - name: Test text extraction with OCR disabled in a 512 MiB memory limit
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 512m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --env OMP_THREAD_LIMIT=1 \
            --entrypoint /usr/local/bin/subforge-smoke \
            subforge-test extraction --text-only

      - name: Test OCR extraction without network or host media
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 1536m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --env OMP_THREAD_LIMIT=1 \
            --entrypoint /usr/local/bin/subforge-smoke \
            subforge-test extraction

      - name: Test actual CPU and memory telemetry in an isolated container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 512m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --entrypoint /usr/local/bin/subforge-smoke subforge-test resources \
            --expected-cpus 2 --expected-memory-mib 512

  frontend-dependencies:
    name: Frontend dependency audit including build tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts pnpm@12.10.1

      - name: Validate dashboard scripts
        run: |
          node --check glance/config/assets/media-live.js
          node --check glance/config/assets/media-calendar.js
          node --check glance/config/assets/widget-live.js
          node --check glance/config/assets/subforge-live.js
          node --check subtitle-studio/web/app.js
          node --check subforge/web/app.js

      - name: Run Media calendar frontend regression tests
        run: node --test glance/test_media_calendar.cjs

      - name: Run Subforge live widget regression tests
        run: node --test glance/test_subforge_live.cjs

      - name: Run Subtitle Studio frontend regression tests
        run: node --test subtitle-studio/test_*.cjs

      # Audit the lockfile without installing or executing repository packages.
      - name: Audit frontend and development dependencies
        run: pnpm --dir subtitle-studio audit --audit-level moderate

  dockerfiles-and-lockfiles:
    name: Dockerfile and lockfile security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfiles and dependency manifests with Trivy
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln,misconfig --include-dev-deps \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m \
            --cache-dir /tmp/trivy-cache --skip-dirs /repo/.git \
            --skip-dirs /repo/subtitle-studio/node_modules /repo
