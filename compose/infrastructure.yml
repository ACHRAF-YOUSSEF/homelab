services:
  # Cloudflare Tunnel to securely expose services without opening ports on the host machine
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    mem_limit: 96m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - homelab
  
  # Cloudflare DDNS to automatically update DNS records for dynamic IP addresses
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    mem_limit: 64m
    restart: unless-stopped
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=${CLOUDFLARE_DDNS_DOMAINS}
      - IP6_PROVIDER=none
      - PROXIED=false
      - UPDATE_CRON=@every 5m
    networks:
      - homelab

  # Permit selected Docker GET endpoints on the isolated monitoring network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: portracker-docker-proxy
    mem_limit: 64m
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - POST=0
    volumes:
      - ${DOCKER_SOCKET_SOURCE:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - docker-monitoring

  # Application for monitoring and tracking Docker containers
  portracker:
    image: mostafawahied/portracker:latest
    container_name: portracker
    mem_limit: 192m
    restart: unless-stopped
    pid: "host"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ../portracker-data:/data
    ports:
      - "4999:4999"
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
      - docker-proxy
    networks:
      - homelab
      - docker-monitoring

  # Reverse proxy to manage and route traffic to different services
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    mem_limit: 384m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - 80:80
      - 81:81
      - 443:443
      - 4443:443
    volumes:
      - ../nginx-proxy-manager/data:/data
      - ../nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - homelab

  # Rust last-good Jellyfin counts cache; no interpreter or GPU access.
  jellyfin-counts-cache:
    build:
      context: ../glance/jellyfin-counts-cache
    container_name: jellyfin-counts-cache
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_INTERNAL_URL=${JELLYFIN_INTERNAL_URL}
      - JELLYFIN_COUNTS_BIND_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD", "/usr/local/bin/jellyfin-counts-cache", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab

  glance:
    container_name: glance
    image: glanceapp/glance:latest
    mem_limit: 192m
    restart: unless-stopped
    volumes:
      - ../glance/config:/app/config:ro
    environment:
      - TZ=${TZ}
      - GLANCE_ADGUARD_INTERNAL_URL=${GLANCE_ADGUARD_INTERNAL_URL}
      - GLANCE_APP_NAME=${GLANCE_APP_NAME}
      - GLANCE_ARS_TECHNICA_FEED_URL=${GLANCE_ARS_TECHNICA_FEED_URL}
      - GLANCE_BAZARR_INTERNAL_URL=${GLANCE_BAZARR_INTERNAL_URL}
      - GLANCE_BLEEPINGCOMPUTER_FEED_URL=${GLANCE_BLEEPINGCOMPUTER_FEED_URL}
      - GLANCE_CHATGPT_URL=${GLANCE_CHATGPT_URL}
      - GLANCE_CLOUDFLARE_DASHBOARD_URL=${GLANCE_CLOUDFLARE_DASHBOARD_URL}
      - GLANCE_COMMUNITY_WIDGETS_REGISTRY_URL=${GLANCE_COMMUNITY_WIDGETS_REGISTRY_URL}
      - GLANCE_DOCKER_HOST=${GLANCE_DOCKER_HOST}
      - GLANCE_DOCKER_HUB_URL=${GLANCE_DOCKER_HUB_URL}
      - GLANCE_EPIC_GAMES_URL=${GLANCE_EPIC_GAMES_URL}
      - GLANCE_GITHUB_URL=${GLANCE_GITHUB_URL}
      - GLANCE_GOG_URL=${GLANCE_GOG_URL}
      - GLANCE_HUGGING_FACE_FEED_URL=${GLANCE_HUGGING_FACE_FEED_URL}
      - GLANCE_HUGGING_FACE_URL=${GLANCE_HUGGING_FACE_URL}
      - GLANCE_INTERNAL_URL=${GLANCE_INTERNAL_URL}
      - GLANCE_IT_TOOLS_INTERNAL_URL=${GLANCE_IT_TOOLS_INTERNAL_URL}
      - GLANCE_JELLYFIN_COUNTS_INTERNAL_URL=${GLANCE_JELLYFIN_COUNTS_INTERNAL_URL}
      - GLANCE_KREBS_FEED_URL=${GLANCE_KREBS_FEED_URL}
      - GLANCE_LOGO_TEXT=${GLANCE_LOGO_TEXT}
      - GLANCE_METUBE_INTERNAL_URL=${GLANCE_METUBE_INTERNAL_URL}
      - GLANCE_N8N_INTERNAL_URL=${GLANCE_N8N_INTERNAL_URL}
      - GLANCE_NGINX_PROXY_MANAGER_INTERNAL_URL=${GLANCE_NGINX_PROXY_MANAGER_INTERNAL_URL}
      - GLANCE_OPEN_WEBUI_INTERNAL_URL=${GLANCE_OPEN_WEBUI_INTERNAL_URL}
      - GLANCE_PHORONIX_FEED_URL=${GLANCE_PHORONIX_FEED_URL}
      - GLANCE_PORTRACKER_INTERNAL_URL=${GLANCE_PORTRACKER_INTERNAL_URL}
      - GLANCE_PROTONDB_URL=${GLANCE_PROTONDB_URL}
      - GLANCE_PROWLARR_INTERNAL_URL=${GLANCE_PROWLARR_INTERNAL_URL}
      - GLANCE_PUBLIC_URL=${GLANCE_PUBLIC_URL}
      - GLANCE_REDDIT_URL=${GLANCE_REDDIT_URL}
      - GLANCE_REGISTER_FEED_URL=${GLANCE_REGISTER_FEED_URL}
      - GLANCE_SCHNEIER_FEED_URL=${GLANCE_SCHNEIER_FEED_URL}
      - GLANCE_SEARXNG_INTERNAL_URL=${GLANCE_SEARXNG_INTERNAL_URL}
      - GLANCE_SELFH_FEED_URL=${GLANCE_SELFH_FEED_URL}
      - GLANCE_STACK_OVERFLOW_URL=${GLANCE_STACK_OVERFLOW_URL}
      - GLANCE_STEAM_URL=${GLANCE_STEAM_URL}
      - GLANCE_STIRLING_PDF_INTERNAL_URL=${GLANCE_STIRLING_PDF_INTERNAL_URL}
      - GLANCE_SUBTITLE_STUDIO_INTERNAL_URL=${GLANCE_SUBTITLE_STUDIO_INTERNAL_URL}
      - GLANCE_SUBFORGE_INTERNAL_URL=${GLANCE_SUBFORGE_INTERNAL_URL:-http://subforge:8100}
      - GLANCE_TDARR_INTERNAL_URL=${GLANCE_TDARR_INTERNAL_URL}
      - GLANCE_TUBEARCHIVIST_INTERNAL_URL=${GLANCE_TUBEARCHIVIST_INTERNAL_URL}
      - GLANCE_UPTIME_KUMA_INTERNAL_URL=${GLANCE_UPTIME_KUMA_INTERNAL_URL}
      - GLANCE_WEATHER_LOCATION=${GLANCE_WEATHER_LOCATION}
      - GLANCE_YOUTUBE_URL=${GLANCE_YOUTUBE_URL}
      - HOMELAB_URL=${HOMELAB_URL}
      - IT_TOOLS_PUBLIC_URL=${IT_TOOLS_PUBLIC_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_INTERNAL_URL=${JELLYFIN_INTERNAL_URL}
      - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_URL}
      - N8N_PUBLIC_URL=${N8N_PUBLIC_URL}
      - NEXTCLOUD_PUBLIC_URL=${NEXTCLOUD_PUBLIC_URL}
      - OPEN_WEBUI_PUBLIC_URL=${OPEN_WEBUI_PUBLIC_URL}
      - QBITTORRENT_INTERNAL_URL=${QBITTORRENT_INTERNAL_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_INTERNAL_URL=${RADARR_INTERNAL_URL}
      - SEERR_API_KEY=${SEERR_API_KEY}
      - SEERR_INTERNAL_URL=${SEERR_INTERNAL_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SUBFORGE_PUBLIC_URL=${SUBFORGE_PUBLIC_URL:-http://localhost:8100}
      - SONARR_INTERNAL_URL=${SONARR_INTERNAL_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker-proxy
      - jellyfin-counts-cache
    networks:
      - homelab
      - docker-monitoring

  # Rust LAN gateway: shared on-demand collectors, bounded streams, no GPU access.
  glance-live:
    build:
      context: ../glance/live
    container_name: glance-live
    mem_limit: ${GLANCE_LIVE_MEMORY_LIMIT:-96m}
    cpus: ${GLANCE_LIVE_CPUS:-0.50}
    pids_limit: 32
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - GLANCE_UPSTREAM_URL=http://glance:8080
      - SONARR_INTERNAL_URL=${SONARR_INTERNAL_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_INTERNAL_URL=${RADARR_INTERNAL_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - GLANCE_LIVE_BIND_ADDRESS=0.0.0.0
      - GLANCE_LIVE_PORT=8081
      - GLANCE_LIVE_ALLOWED_HOSTS=${GLANCE_LIVE_ALLOWED_HOSTS:-localhost,127.0.0.1},${GLANCE_BIND_ADDRESS:-127.0.0.1}
      - GLANCE_LIVE_QBITTORRENT_INTERVAL=${GLANCE_LIVE_QBITTORRENT_INTERVAL:-2}
      - GLANCE_LIVE_JELLYFIN_INTERVAL=${GLANCE_LIVE_JELLYFIN_INTERVAL:-5}
      - GLANCE_SUBFORGE_INTERNAL_URL=${GLANCE_SUBFORGE_INTERNAL_URL:-http://subforge:8100}
      - CONVERTER_WIDGET_TOKEN=${CONVERTER_WIDGET_TOKEN:-}
      - GLANCE_LIVE_JELLYFIN_WS=${GLANCE_LIVE_JELLYFIN_WS:-true}
      - GLANCE_LIVE_MAX_CONNECTIONS=${GLANCE_LIVE_MAX_CONNECTIONS:-64}
      - GLANCE_LIVE_MAX_HTTP_CONNECTIONS=${GLANCE_LIVE_MAX_HTTP_CONNECTIONS:-128}
      - GLANCE_LIVE_SSE_MAX_SECONDS=${GLANCE_LIVE_SSE_MAX_SECONDS:-900}
      - GLANCE_LIVE_MAX_PROVIDER_BYTES=${GLANCE_LIVE_MAX_PROVIDER_BYTES:-2097152}
      - GLANCE_LIVE_MAX_SNAPSHOT_BYTES=${GLANCE_LIVE_MAX_SNAPSHOT_BYTES:-262144}
      - GLANCE_LIVE_MISSING_MAX_PROVIDER_BYTES=${GLANCE_LIVE_MISSING_MAX_PROVIDER_BYTES:-8388608}
      - GLANCE_LIVE_MISSING_MAX_SNAPSHOT_BYTES=${GLANCE_LIVE_MISSING_MAX_SNAPSHOT_BYTES:-2097152}
      - GLANCE_LIVE_MAX_TORRENTS=${GLANCE_LIVE_MAX_TORRENTS:-2000}
      - GLANCE_LIVE_MAX_SESSIONS=${GLANCE_LIVE_MAX_SESSIONS:-256}
      - JELLYFIN_INTERNAL_URL=${JELLYFIN_INTERNAL_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - QBITTORRENT_INTERNAL_URL=${QBITTORRENT_INTERNAL_URL}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-}
    ports:
      - "${GLANCE_BIND_ADDRESS:-127.0.0.1}:7575:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - glance
    healthcheck:
      test: ["CMD", "/usr/local/bin/glance-live", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - homelab

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    mem_limit: 384m
    volumes:
      - ../uptime-kuma:/app/data
    ports:
      - "47028:3001"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - UMASK=0022
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab
      - docker-monitoring
    depends_on:
      - docker-proxy
