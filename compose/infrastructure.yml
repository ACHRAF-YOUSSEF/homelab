services:
  # Cloudflare Tunnel to securely expose services without opening ports on the host machine
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    mem_limit: 128m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - homelab
  
  # Cloudflare DDNS to automatically update DNS records for dynamic IP addresses
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    mem_limit: 64m
    restart: unless-stopped
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=jellyfin.achrafyoussef.tech, ai.achrafyoussef.tech
      - IP6_PROVIDER=none
      - PROXIED=false
      - UPDATE_CRON=@every 5m
    networks:
      - homelab

  # Proxy to expose Docker API securely to other containers without giving them direct access to the Docker socket
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: portracker-docker-proxy
    mem_limit: 128m
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    networks:
      - homelab

  # Application for monitoring and tracking Docker containers
  portracker:
    image: mostafawahied/portracker:latest
    container_name: portracker
    mem_limit: 256m
    restart: unless-stopped
    pid: "host"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ../portracker-data:/data
    ports:
      - "4999:4999"
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
      - docker-proxy
    networks:
      - homelab

  # Reverse proxy to manage and route traffic to different services
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    mem_limit: 512m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - 80:80
      - 81:81
      - 443:443
    volumes:
      - ../nginx-proxy-manager/data:/data
      - ../nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - homelab

  # Responsive, feed-oriented dashboard with page tabs
  jellyfin-counts-cache:
    image: python:3.12-alpine
    container_name: jellyfin-counts-cache
    mem_limit: 64m
    restart: unless-stopped
    command: python /app/jellyfin-counts-cache.py
    environment:
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    volumes:
      - ../glance/jellyfin-counts-cache.py:/app/jellyfin-counts-cache.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab

  glance:
    container_name: glance
    image: glanceapp/glance:latest
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - ../glance/config:/app/config:ro
    environment:
      - TZ=${TZ}
      - HOMELAB_URL=${HOMELAB_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SEERR_API_KEY=${SEERR_API_KEY}
    ports:
      - "7575:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker-proxy
      - jellyfin-counts-cache
    networks:
      - homelab

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    mem_limit: 512m
    volumes:
      - ../uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "47028:3001"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - UMASK=0022
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab
