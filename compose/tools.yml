services:
  # Developer Tools Collection
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    mem_limit: 64m
    ports:
      - 8888:80
    restart: unless-stopped
    networks:
      - homelab

  # Stirling PDF - Self-hosted PDF management and automation tool
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    mem_limit: ${STIRLING_PDF_MEMORY_LIMIT:-1536m}
    ports:
      - "48537:8080"
    volumes:
      - ../stirling/tessdata:/usr/share/tessdata
      - ../stirling/configs:/configs
      - ../stirling/logs:/logs
      - ../stirling/pipeline:/pipeline
    environment:
      - SECURITY_ENABLELOGIN=false
      - LANGS=en_GB
      - JAVA_CUSTOM_OPTS=-XX:InitialRAMPercentage=5 -XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=192m
    restart: unless-stopped
    networks:
      - homelab
