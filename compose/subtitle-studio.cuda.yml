services:
  subtitle-studio:
    image: homelab-subtitle-studio:1.0.0-cuda
    pull_policy: never
    build:
      context: ./subtitle-studio
      dockerfile: Dockerfile.cuda
      args:
        CUDA_ARCHITECTURES: "${SUBTITLE_CUDA_ARCHITECTURES:-75;80;86;89}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - WHISPER_DEVICE=cuda
