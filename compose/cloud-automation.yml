services:
  # Automation Platform - n8n for workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PROTOCOL=http
      - N8N_HOST=192.168.0.163
      - WEBHOOK_URL=http://192.168.0.163:5678/
      - NODE_ENV=production
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_SECURE_COOKIE=false
    volumes:
      - ../n8n/n8n_data:/home/node/.n8n
    networks:
      - homelab

  # Local subtitle studio with its own browser UI; n8n is not involved.
  subtitle-worker:
    build:
      context: ../subtitle-worker
    container_name: subtitle-worker
    mem_limit: 6g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    ports:
      - "${SUBTITLE_BIND_ADDRESS:-127.0.0.1}:8099:8099"
    environment:
      - SUBTITLE_LIBRARY_ROOT=/library
      - SUBTITLE_OUTPUT_ROOT=/media/output
      - SUBTITLE_DATA_ROOT=/data
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_LOCAL_FILES_ONLY=${WHISPER_LOCAL_FILES_ONLY:-false}
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=int8_float16
      - SUBTITLE_LLM_BASE_URL=${SUBTITLE_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - SUBTITLE_LLM_MODEL=${SUBTITLE_LLM_MODEL:-}
      - SUBTITLE_LLM_TIMEOUT=${SUBTITLE_LLM_TIMEOUT:-600}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${SUBTITLE_MEDIA_DIR:-D:/subtitles}:/media
      - ${SUBTITLE_LIBRARY_DIR:-D:/}:/library:ro
      - subtitle_models:/models
      - subtitle_data:/data
    networks:
      - homelab

volumes:
  subtitle_models:
  subtitle_data:
