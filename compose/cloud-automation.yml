services:
  # Automation Platform - n8n for workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PROTOCOL=http
      - N8N_HOST=192.168.0.163
      - WEBHOOK_URL=http://192.168.0.163:5678/
      - NODE_ENV=production
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_SECURE_COOKIE=false
    volumes:
      - ../n8n/n8n_data:/home/node/.n8n
    networks:
      - homelab

  # Local MKV audio translation worker; called by the imported n8n workflow.
  subtitle-worker:
    build:
      context: ../subtitle-worker
    container_name: subtitle-worker
    mem_limit: 6g
    restart: unless-stopped
    environment:
      - SUBTITLE_MEDIA_ROOT=/media
      - SUBTITLE_SOURCE_ROOT=/source
      - SUBTITLE_SOURCE_HOST_DIR=${SUBTITLE_SOURCE_DIR:-D:/subtitles/input}
      - SUBTITLE_MIN_AGE_SECONDS=${SUBTITLE_MIN_AGE_SECONDS:-90}
      - SUBTITLE_AUDIO_TRACK=${SUBTITLE_AUDIO_TRACK:-0}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-}
      - SUBTITLE_LLM_PROVIDER=lmstudio
      - SUBTITLE_LLM_BASE_URL=${SUBTITLE_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - SUBTITLE_LLM_MODEL=${SUBTITLE_LLM_MODEL:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${SUBTITLE_MEDIA_DIR:-D:/subtitles}:/media
      - ${SUBTITLE_SOURCE_DIR:-D:/subtitles/input}:/source:ro
      - subtitle_models:/models
    networks:
      - homelab

volumes:
  subtitle_models:
