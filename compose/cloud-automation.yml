services:
  # Automation Platform - n8n for workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PROTOCOL=http
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - NODE_ENV=production
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_SECURE_COOKIE=false
    volumes:
      - ../n8n/n8n_data:/home/node/.n8n
    networks:
      - homelab

  # Local subtitle studio with its own browser UI; n8n is not involved.
  subtitle-worker:
    build:
      context: ../subtitle-worker
    container_name: subtitle-worker
    mem_limit: ${SUBTITLE_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${SUBTITLE_WORKER_CPUS:-2}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "${SUBTITLE_BIND_ADDRESS:-127.0.0.1}:${SUBTITLE_PORT:-8099}:${SUBTITLE_PORT:-8099}"
    environment:
      - SUBTITLE_BIND_ADDRESS=0.0.0.0
      - SUBTITLE_PORT=${SUBTITLE_PORT:-8099}
      - SUBTITLE_ALLOWED_HOSTS=${SUBTITLE_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,subtitle-worker}
      - SUBTITLE_LIBRARY_ROOT=/library
      - SUBTITLE_OUTPUT_ROOT=/media/output
      - SUBTITLE_DATA_ROOT=/data
      - WHISPER_MODEL=${WHISPER_MODEL:-small-q5_1}
      - WHISPER_LOCAL_FILES_ONLY=${WHISPER_LOCAL_FILES_ONLY:-true}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_CLI=${WHISPER_CLI:-whisper-cli}
      - SUBTITLE_MODEL_DOWNLOAD_TIMEOUT=${SUBTITLE_MODEL_DOWNLOAD_TIMEOUT:-3600}
      - SUBTITLE_CPU_THREADS=${SUBTITLE_CPU_THREADS:-2}
      - SUBTITLE_AUDIO_CHUNK_SECONDS=${SUBTITLE_AUDIO_CHUNK_SECONDS:-300}
      - SUBTITLE_PROCESS_TIMEOUT=${SUBTITLE_PROCESS_TIMEOUT:-3600}
      - SUBTITLE_MAX_JOBS=${SUBTITLE_MAX_JOBS:-500}
      - SUBTITLE_MAX_QUEUE=${SUBTITLE_MAX_QUEUE:-32}
      - SUBTITLE_MAX_CLIENTS=${SUBTITLE_MAX_CLIENTS:-16}
      - SUBTITLE_MAX_STREAMS=${SUBTITLE_MAX_STREAMS:-8}
      - SUBTITLE_MAX_JSON_BYTES=${SUBTITLE_MAX_JSON_BYTES:-16777216}
      - SUBTITLE_LLM_BASE_URL=${SUBTITLE_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - SUBTITLE_LLM_MODEL=${SUBTITLE_LLM_MODEL:-}
      - SUBTITLE_REVIEW_MODEL=${SUBTITLE_REVIEW_MODEL:-}
      - SUBTITLE_LLM_TIMEOUT=${SUBTITLE_LLM_TIMEOUT:-600}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${SUBTITLE_MEDIA_DIR:-D:/subtitles}:/media
      - ${SUBTITLE_LIBRARY_DIR:-D:/}:/library:ro
      - subtitle_models:/models
      - subtitle_data:/data
    networks:
      - homelab

volumes:
  subtitle_models:
  subtitle_data:
