services:
  # Diagrams - Tools for creating and managing diagrams, including Draw.io and Excalidraw
  drawio:
    image: jgraph/drawio:latest
    container_name: drawio
    ports:
      - 8081:8080
    restart: unless-stopped
    networks:
      - homelab

  # Excalidraw (self-hosted version)
  excalidraw:
    build: ../excalidraw
    container_name: excalidraw
    ports:
      - 8082:80
    restart: unless-stopped
    networks:
      - homelab

  # Excalidraw Room - Collaborative version of Excalidraw for real-time diagramming
  excalidraw-room:
    build: ../excalidraw-room
    container_name: excalidraw-room
    ports:
      - 8083:80
    restart: unless-stopped
    networks:
      - homelab

  # MongoDB instance for Excalidraw Storage Service
  excalidraw-mongo:
    image: mongo:7
    container_name: excalidraw-mongo
    volumes:
      - ../excalidraw-mongo-data:/data/db
    restart: unless-stopped
    networks:
      - homelab

  # Excalidraw Storage Service to handle saving and retrieving drawings
  excalidraw-storage:
    build: ../excalidraw-storage
    container_name: excalidraw-storage
    ports:
      - "7802:7802"
    environment:
      - MONGO_URL=mongodb://excalidraw-mongo:27017
      - MONGO_DB=excalidraw
    depends_on:
      - excalidraw-mongo
    restart: unless-stopped
    networks:
      - homelab

  # Text-to-Diagram AI (uses LM Studio)
  text-to-diagram:
    build: ../text-to-diagram
    container_name: text-to-diagram
    ports:
      - "7801:7801"
    environment:
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
      - LM_STUDIO_MODEL=openai/gpt-oss-20b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - homelab
