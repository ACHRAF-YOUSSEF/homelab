services:
  # Download Clients - qBittorrent for torrenting, integrated with Sonarr/Radarr for automated media management
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    mem_limit: 512m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ../qbittorrent:/config
      - D:/downloads:/downloads
    restart: unless-stopped
    networks:
      - homelab

  # Indexer Manager to manage and aggregate torrent indexers for Sonarr/Radarr
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    mem_limit: 384m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - homelab

  # TV Shows
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    mem_limit: 512m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../sonarr:/config
      - D:/tv show:/tv
      - C:/tv show:/tv-C
      - D:/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - homelab

  # Movies
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    mem_limit: 512m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../radarr:/config
      - D:/film:/media
      - C:/film:/media-C
      - D:/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - homelab
  
  # Media Management and Tracking
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    mem_limit: 512m
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ../seerr/data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - homelab

  # Subtitles
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    mem_limit: 384m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../bazarr:/config
      - D:/film:/movies
      - C:/film:/movies-C
      - D:/tv show:/tv
      - C:/tv show:/tv-C
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - homelab

  # Opt-in local conversion of embedded and sidecar subtitles, including OCR.
  subtitle-converter:
    build:
      context: ../subtitle-converter
    profiles: [subtitle-conversion]
    container_name: subtitle-converter
    init: true
    mem_limit: ${CONVERTER_MEMORY_LIMIT:-1536m}
    cpus: 2
    pids_limit: 128
    ports:
      - ${CONVERTER_BIND_ADDRESS:-127.0.0.1}:8100:8100
    networks:
      - homelab
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      # Self-contained .NET extracts native libraries here for loading.
      - /tmp:rw,nosuid,nodev,size=512m
    environment:
      - CONVERTER_SCAN_INTERVAL=${CONVERTER_SCAN_INTERVAL:-300}
      - CONVERTER_MIN_AGE=${CONVERTER_MIN_AGE:-120}
      - CONVERTER_TIMEOUT=${CONVERTER_TIMEOUT:-7200}
      - CONVERTER_RETRY_INTERVAL=${CONVERTER_RETRY_INTERVAL:-3600}
      - CONVERTER_ENABLE_OCR=${CONVERTER_ENABLE_OCR:-false}
      - CONVERTER_OCR_LANGUAGE=${CONVERTER_OCR_LANGUAGE:-eng}
      - CONVERTER_UI_PASSWORD=${CONVERTER_UI_PASSWORD:-}
      - CONVERTER_ALLOWED_HOSTS=${CONVERTER_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,subtitle-converter}
      - CONVERTER_WEBHOOK_TOKEN=${CONVERTER_WEBHOOK_TOKEN:-}
      - CONVERTER_WIDGET_TOKEN=${CONVERTER_WIDGET_TOKEN:-}
      - SONARR_INTERNAL_URL=${SONARR_INTERNAL_URL:-http://sonarr:8989}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_INTERNAL_URL=${RADARR_INTERNAL_URL:-http://radarr:7878}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - BAZARR_INTERNAL_URL=${BAZARR_INTERNAL_URL:-http://bazarr:6767}
      - BAZARR_API_KEY=${BAZARR_API_KEY:-}
      - JELLYFIN_INTERNAL_URL=${JELLYFIN_INTERNAL_URL:-http://host.docker.internal:8096}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
    volumes:
      - ${CONVERTER_MOVIES_DIR:-D:/film}:/movies
      - ${CONVERTER_MOVIES_C_DIR:-C:/film}:/movies-C
      - ${CONVERTER_TV_DIR:-D:/tv show}:/tv
      - ${CONVERTER_TV_C_DIR:-C:/tv show}:/tv-C
      - subtitle_converter_data:/data
    restart: unless-stopped

  # Transcoding and Media Management
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    mem_limit: 1536m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - nodeName=MainNode
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ../tdarr/server:/app/server
      - ../tdarr/configs:/app/configs
      - ../tdarr/logs:/app/logs
      - /d/film:/movies
      - /c/film:/movies-C
      - /d/tv show:/tv
      - /c/tv show:/tv-C
      - /d/transcode_cache:/temp
    ports:
      - 8265:8265
      - 8266:8266
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - homelab

  # MeTube - Self-hosted YouTube downloader and media management tool
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    mem_limit: 512m
    environment:
      DOWNLOAD_DIR: /downloads
      UID: 1000
      GID: 1000
      DEFAULT_MERGE_FORMAT: mkv
      YTDL_OPTIONS: >-
        {
          "writeinfojson": true,
          "writethumbnail": true,
          "keepvideo": false,

          "writesubtitles": true,
          "writeautomaticsub": true,
          "subtitleslangs": ["en","-live_chat"],
          "convertsubtitles": "srt",

          "embedsubtitles": true,
          "embedthumbnail": false,
          "ignoreerrors": "only_download",

          "postprocessors": [
            {
              "key": "FFmpegEmbedSubtitle",
              "already_have_subtitle": false
            },
            {
              "key": "FFmpegMetadata",
              "add_metadata": true,
              "add_chapters": true
            }
          ]
        }
      OUTPUT_TEMPLATE: "%(title)s [%(id)s].%(ext)s"
    volumes:
      - D:/yt-dlp:/downloads
    ports:
      - "8085:8081"
    restart: unless-stopped
    networks:
      - homelab

  # TubeArchivist - Self-hosted YouTube archiving and management tool
  tubearchivist:
    container_name: tubearchivist
    restart: unless-stopped
    image: bbilly1/tubearchivist
    mem_limit: 1g
    ports:
      - 8000:8000
    volumes:
      - D:/YT/youtube:/youtube
      - D:/YT/cache:/cache
    environment:
      - ES_URL=http://archivist-es:9200
      - REDIS_CON=redis://archivist-redis:6379
      - HOST_UID=1000
      - HOST_GID=1000
      - TA_HOST=${TUBEARCHIVIST_PUBLIC_URL}
      - TA_USERNAME=${YT_TA_USERNAME}
      - TA_PASSWORD=${YT_TA_PASSWORD}
      - ELASTIC_PASSWORD=${YT_ELASTIC_PASSWORD}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-es
      - archivist-redis
    networks:
      - homelab

  # Redis instance for TubeArchivist to use for caching and performance optimization
  archivist-redis:
    image: redis
    container_name: archivist-redis
    mem_limit: 128m
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - ../archivist/redis:/data
    depends_on:
      - archivist-es
    networks:
      - homelab

  # Elasticsearch instance for TubeArchivist to use for indexing and searching archived content
  archivist-es:
    image: bbilly1/tubearchivist-es
    container_name: archivist-es
    mem_limit: ${ARCHIVIST_ES_MEMORY_LIMIT:-1536m}
    restart: unless-stopped
    environment:
      - "ELASTIC_PASSWORD=${YT_ELASTIC_PASSWORD}"
      - "ES_JAVA_OPTS=-Xms384m -Xmx384m"
      - "xpack.security.enabled=true"
      - "discovery.type=single-node"
      - "path.repo=/usr/share/elasticsearch/data/snapshot"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ../archivist/es:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      - homelab

volumes:
  subtitle_converter_data:
