[package]
name = "subforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
base64 = "=0.22.1"
ctrlc = { version = "=3.5.0", features = ["termination"] }
fs2 = "=0.4.3"
percent-encoding = "=2.3.2"
rand = "=0.9.3"
regex = "=1.12.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
httparse = "=1.10.1"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls", "json"] }
url = "=2.5.7"
walkdir = "=2.5.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
