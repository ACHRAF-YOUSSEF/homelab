[package]
name = "subforge-ocr"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
default = []
cuda = ["ocr-rs/cuda"]

[dependencies]
image = { version = "=0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
ocr-rs = { version = "=2.4.1", default-features = false, features = ["build-mnn-from-source"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

# Keep the upstream OCR implementation while dropping unused font parsers and
# updating imageproc's unmaintained matrix macro dependency. See vendor/README.md.
[patch.crates-io]
ocr-rs = { path = "vendor/ocr-rs" }
image = { path = "vendor/image" }
