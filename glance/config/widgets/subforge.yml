- type: html
  title: Subforge
  css-class: media-live-subforge
  source: |
    <div class="widget media-live-subforge">
      <div class="widget-header">
        <h2><a class="uppercase" href="${SUBFORGE_PUBLIC_URL}" target="_blank" rel="noreferrer">Subforge</a></h2>
      </div>
      <div class="widget-content">
        <p class="color-subdue">Loading live job activity…</p>
        <noscript>Enable JavaScript to see live Subforge jobs.</noscript>
        <a data-subforge-link class="block margin-top-15 color-primary" href="${SUBFORGE_PUBLIC_URL}">Open Subforge ↗</a>
      </div>
    </div>
