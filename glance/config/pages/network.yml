- name: Network
  slug: network
  width: wide
  show-mobile-header: true
  
  columns:
    - size: small
      widgets:
        - type: monitor
          title: Edge services
          cache: 1m
          sites:
            - title: AdGuard Home
              url: ${HOMELAB_URL}:8180
              check-url: http://adguardhome:80
              icon: sh:adguard-home
            - title: Nginx Proxy Manager
              url: ${HOMELAB_URL}:81
              check-url: http://nginx-proxy-manager:81
              icon: sh:nginx-proxy-manager
            - title: Uptime Kuma
              url: ${HOMELAB_URL}:47028
              check-url: http://uptime-kuma:3001
              icon: sh:uptime-kuma
            - title: Portracker
              url: ${HOMELAB_URL}:4999
              check-url: http://portracker:4999
              icon: sh:portracker
  
    - size: full
      widgets:
        - type: monitor
          title: Public endpoints
          style: compact
          cache: 1m
          sites:
            - title: Dashboard
              url: https://home.achrafyoussef.tech/
              check-url: http://glance:8080
              icon: sh:glance
            - title: Jellyfin
              url: https://jellyfin.achrafyoussef.tech/
              check-url: http://host.docker.internal:8096
              icon: sh:jellyfin
            - title: Open WebUI
              url: https://ai.achrafyoussef.tech/
              check-url: http://open-webui:8080
              icon: sh:open-webui
            - title: Nextcloud
              url: https://cloud.achrafyoussef.tech/
              icon: sh:nextcloud
              alt-status-codes: [301, 302, 307, 308]
            - title: IT-Tools
              url: https://tools.achrafyoussef.tech/
              check-url: http://it-tools:80
              icon: sh:it-tools
            - title: n8n
              url: https://n8n.achrafyoussef.tech/
              check-url: http://n8n:5678
              icon: sh:n8n
  
        - type: releases
          title: Infrastructure releases
          cache: 12h
          show-source-icon: true
          repositories:
            - glanceapp/glance
            - louislam/uptime-kuma
            - NginxProxyManager/nginx-proxy-manager
            - AdguardTeam/AdGuardHome
            - cloudflare/cloudflared
  
    - size: small
      widgets:
        - type: bookmarks
          title: Administration
          groups:
            - title: Network
              color: 197 82 55
              links:
                - title: AdGuard Home
                  url: ${HOMELAB_URL}:8180
                  icon: sh:adguard-home
                - title: Nginx Proxy Manager
                  url: ${HOMELAB_URL}:81
                  icon: sh:nginx-proxy-manager
                - title: Uptime Kuma
                  url: ${HOMELAB_URL}:47028
                  icon: sh:uptime-kuma
                - title: Portracker
                  url: ${HOMELAB_URL}:4999
                  icon: sh:portracker
            - title: Providers
              color: 28 94 58
              links:
                - title: Cloudflare
                  url: https://one.dash.cloudflare.com/
                  icon: si:cloudflare
