- name: Network
  slug: network
  width: wide
  show-mobile-header: true
  
  columns:
    - size: small
      widgets:
        - type: monitor
          title: Edge services
          cache: 1m
          sites:
            - title: AdGuard Home
              url: ${HOMELAB_URL}:8180
              check-url: ${GLANCE_ADGUARD_INTERNAL_URL}
              icon: sh:adguard-home
            - title: Nginx Proxy Manager
              url: ${HOMELAB_URL}:81
              check-url: ${GLANCE_NGINX_PROXY_MANAGER_INTERNAL_URL}
              icon: sh:nginx-proxy-manager
            - title: Uptime Kuma
              url: ${HOMELAB_URL}:47028
              check-url: ${GLANCE_UPTIME_KUMA_INTERNAL_URL}
              icon: sh:uptime-kuma
            - title: Portracker
              url: ${HOMELAB_URL}:4999
              check-url: ${GLANCE_PORTRACKER_INTERNAL_URL}
              icon: sh:portracker
  
    - size: full
      widgets:
        - type: monitor
          title: Public endpoints
          style: compact
          cache: 1m
          sites:
            - title: Dashboard
              url: ${GLANCE_PUBLIC_URL}
              check-url: ${GLANCE_INTERNAL_URL}
              icon: sh:glance
            - title: Jellyfin
              url: ${JELLYFIN_PUBLIC_URL}
              check-url: ${JELLYFIN_INTERNAL_URL}
              icon: sh:jellyfin
            - title: Open WebUI
              url: ${OPEN_WEBUI_PUBLIC_URL}
              check-url: ${GLANCE_OPEN_WEBUI_INTERNAL_URL}
              icon: sh:open-webui
            - title: Nextcloud
              url: ${NEXTCLOUD_PUBLIC_URL}
              icon: sh:nextcloud
              alt-status-codes: [301, 302, 307, 308]
            - title: IT-Tools
              url: ${IT_TOOLS_PUBLIC_URL}
              check-url: ${GLANCE_IT_TOOLS_INTERNAL_URL}
              icon: sh:it-tools
            - title: n8n
              url: ${N8N_PUBLIC_URL}
              check-url: ${GLANCE_N8N_INTERNAL_URL}
              icon: sh:n8n
  
        - type: releases
          title: Infrastructure releases
          cache: 12h
          show-source-icon: true
          repositories:
            - glanceapp/glance
            - louislam/uptime-kuma
            - NginxProxyManager/nginx-proxy-manager
            - AdguardTeam/AdGuardHome
            - cloudflare/cloudflared
  
    - size: small
      widgets:
        - type: bookmarks
          title: Administration
          groups:
            - title: Network
              color: 197 82 55
              links:
                - title: AdGuard Home
                  url: ${HOMELAB_URL}:8180
                  icon: sh:adguard-home
                - title: Nginx Proxy Manager
                  url: ${HOMELAB_URL}:81
                  icon: sh:nginx-proxy-manager
                - title: Uptime Kuma
                  url: ${HOMELAB_URL}:47028
                  icon: sh:uptime-kuma
                - title: Portracker
                  url: ${HOMELAB_URL}:4999
                  icon: sh:portracker
            - title: Providers
              color: 28 94 58
              links:
                - title: Cloudflare
                  url: ${GLANCE_CLOUDFLARE_DASHBOARD_URL}/
                  icon: si:cloudflare
