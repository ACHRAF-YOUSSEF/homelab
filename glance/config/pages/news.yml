- name: News
  slug: news
  width: wide
  show-mobile-header: true
  
  columns:
    - size: small
      widgets:
        - type: rss
          title: Security
          limit: 24
          collapse-after: 10
          cache: 1h
          feeds:
            - url: ${GLANCE_BLEEPINGCOMPUTER_FEED_URL}
              title: BleepingComputer
            - url: ${GLANCE_KREBS_FEED_URL}
              title: Krebs on Security
            - url: ${GLANCE_SCHNEIER_FEED_URL}
              title: Schneier on Security
  
    - size: full
      widgets:
        - type: group
          widgets:
            - type: hacker-news
              title: Hacker News
              limit: 20
              collapse-after: 10
            - type: lobsters
              title: Lobsters
              limit: 20
              collapse-after: 10
            - type: reddit
              title: Technology
              subreddit: technology
              show-thumbnails: true
              collapse-after: 10
            - type: reddit
              title: Self-hosted
              subreddit: selfhosted
              show-thumbnails: true
              collapse-after: 10
            - type: reddit
              title: AI
              subreddit: LocalLLaMA
              show-thumbnails: true
              collapse-after: 10
  
        - type: rss
          title: Software, infrastructure & AI
          style: horizontal-cards
          limit: 18
          collapse-after: 12
          cache: 1h
          feeds:
            - url: ${GLANCE_ARS_TECHNICA_FEED_URL}
              title: Ars Technica
            - url: ${GLANCE_REGISTER_FEED_URL}
              title: The Register
            - url: ${GLANCE_SELFH_FEED_URL}
              title: selfh.st
            - url: ${GLANCE_PHORONIX_FEED_URL}
              title: Phoronix
            - url: ${GLANCE_HUGGING_FACE_FEED_URL}
              title: Hugging Face
  
        - type: videos
          title: Tech videos
          style: grid-cards
          collapse-after-rows: 2
          channels:
            - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
            - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
            - UCsBjURrPoezykLs9EqgamOA # Fireship
            - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
  
    - size: small
      widgets:
        - type: releases
          title: Project releases
          cache: 12h
          show-source-icon: true
          collapse-after: 10
          repositories:
            - glanceapp/glance
            - open-webui/open-webui
            - n8n-io/n8n
            - jellyfin/jellyfin
            - Nextcloud/server
            - AdguardTeam/AdGuardHome
            - louislam/uptime-kuma
