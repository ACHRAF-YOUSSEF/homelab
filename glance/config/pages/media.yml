- name: Media
  slug: media
  width: wide
  show-mobile-header: true
  
  columns:
    - size: small
      widgets:
        - type: monitor
          title: Media services
          css-class: media-live-services
          cache: 30s
          sites:
            - title: Jellyfin
              url: ${JELLYFIN_PUBLIC_URL}
              check-url: ${JELLYFIN_INTERNAL_URL}
              icon: sh:jellyfin
            - title: Seerr
              url: ${HOMELAB_URL}:5055
              check-url: ${SEERR_INTERNAL_URL}
              icon: sh:seerr
            - title: TubeArchivist
              url: ${HOMELAB_URL}:8000
              check-url: ${GLANCE_TUBEARCHIVIST_INTERNAL_URL}
              icon: sh:tube-archivist.png
  
        - type: bookmarks
          title: Watch
          groups:
            - title: Libraries
              color: 267 72 62
              links:
                - title: Jellyfin
                  description: Movies, shows and IPTV
                  url: ${JELLYFIN_PUBLIC_URL}
                  icon: sh:jellyfin
                - title: TubeArchivist
                  description: Archived YouTube library
                  url: ${HOMELAB_URL}:8000
                  icon: sh:tube-archivist.png
  
    - size: full
      widgets:
        - type: split-column
          widgets:
            - $include: ../widgets/jellyfin-stats.yml
            - $include: ../widgets/jellyfin-library.yml

        - $include: ../widgets/media-calendar.yml

        - type: monitor
          title: Automation
          css-class: media-live-automation
          cache: 30s
          sites:
            - title: Sonarr
              url: ${HOMELAB_URL}:8989
              check-url: ${SONARR_INTERNAL_URL}
              icon: sh:sonarr
            - title: Radarr
              url: ${HOMELAB_URL}:7878
              check-url: ${RADARR_INTERNAL_URL}
              icon: sh:radarr
            - title: Bazarr
              url: ${HOMELAB_URL}:6767
              check-url: ${GLANCE_BAZARR_INTERNAL_URL}
              icon: sh:bazarr
            - title: Subtitle Studio
              url: ${HOMELAB_URL}:8099
              check-url: ${GLANCE_SUBTITLE_STUDIO_INTERNAL_URL}
              icon: /assets/subtitle-studio.svg
            - title: Prowlarr
              url: ${HOMELAB_URL}:9696
              check-url: ${GLANCE_PROWLARR_INTERNAL_URL}
              icon: sh:prowlarr
            - title: Tdarr
              url: ${HOMELAB_URL}:8265
              check-url: ${GLANCE_TDARR_INTERNAL_URL}
              icon: sh:tdarr.png
  
        - type: releases
          title: Media stack releases
          cache: 12h
          show-source-icon: true
          collapse-after: 6
          repositories:
            - jellyfin/jellyfin
            - Sonarr/Sonarr
            - Radarr/Radarr
            - Prowlarr/Prowlarr
            - seerr-team/seerr
            - bbilly1/tubearchivist
  
    - size: small
      widgets:
        - $include: ../widgets/seerr-requests.yml

        - type: bookmarks
          title: Manage
          groups:
            - title: Requests
              color: 173 70 45
              links:
                - title: Seerr
                  url: ${HOMELAB_URL}:5055
                  icon: sh:seerr
            - title: Automation
              color: 38 90 58
              links:
                - title: Sonarr
                  url: ${HOMELAB_URL}:8989
                  icon: sh:sonarr
                - title: Radarr
                  url: ${HOMELAB_URL}:7878
                  icon: sh:radarr
                - title: Bazarr
                  url: ${HOMELAB_URL}:6767
                  icon: sh:bazarr
                - title: Subtitle Studio
                  description: Transcribe and translate subtitles
                  url: ${HOMELAB_URL}:8099
                  icon: /assets/subtitle-studio.svg
                - title: Prowlarr
                  url: ${HOMELAB_URL}:9696
                  icon: sh:prowlarr
