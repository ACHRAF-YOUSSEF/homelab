- name: Tools
  slug: tools
  width: wide
  show-mobile-header: true
  
  columns:
    - size: small
      widgets:
        - type: monitor
          title: Self-hosted tools
          cache: 1m
          sites:
            - title: IT-Tools
              url: ${IT_TOOLS_PUBLIC_URL}
              check-url: ${GLANCE_IT_TOOLS_INTERNAL_URL}
              icon: sh:it-tools
            - title: Stirling PDF
              url: ${HOMELAB_URL}:48537
              check-url: ${GLANCE_STIRLING_PDF_INTERNAL_URL}
              icon: sh:stirling-pdf
            - title: n8n
              url: ${N8N_PUBLIC_URL}
              check-url: ${GLANCE_N8N_INTERNAL_URL}
              icon: sh:n8n
            - title: SearXNG
              url: ${HOMELAB_URL}:8088
              check-url: ${GLANCE_SEARXNG_INTERNAL_URL}
              icon: sh:searxng
  
    - size: full
      widgets:
        - type: bookmarks
          title: Applications
          groups:
            - title: AI & automation
              color: 288 65 64
              links:
                - title: Open WebUI
                  description: Local AI chat
                  url: ${OPEN_WEBUI_PUBLIC_URL}
                  icon: sh:open-webui
                - title: n8n
                  description: Workflow automation
                  url: ${N8N_PUBLIC_URL}
                  icon: sh:n8n
                - title: SearXNG
                  description: Private metasearch
                  url: ${HOMELAB_URL}:8088
                  icon: sh:searxng
            - title: Documents & cloud
              color: 205 78 58
              links:
                - title: Nextcloud
                  description: Files and collaboration
                  url: ${NEXTCLOUD_PUBLIC_URL}
                  icon: sh:nextcloud
                - title: Stirling PDF
                  description: PDF toolbox
                  url: ${HOMELAB_URL}:48537
                  icon: sh:stirling-pdf
                - title: IT-Tools
                  description: Developer utilities
                  url: ${IT_TOOLS_PUBLIC_URL}
                  icon: sh:it-tools
        # Keyless widget from glanceapp/community-widgets.
        - type: custom-api
          title: Latest Glance community widgets
          cache: 1d
          url: ${GLANCE_COMMUNITY_WIDGETS_REGISTRY_URL}
          template: |
            <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
              {{ $widgets := .JSON.Array "" | sortByTime "time_added" "rfc3339" "desc" }}
              {{ if gt (len $widgets) 10 }}
                {{ $widgets = slice $widgets 0 10 }}
              {{ end }}
              {{ range $widgets }}
              <li>
                <a class="size-h4 block text-truncate color-primary-if-not-visited" href="${GLANCE_GITHUB_URL}/glanceapp/community-widgets/blob/main/widgets/{{ .String "directory" }}/README.md" target="_blank" rel="noreferrer">{{ .String "title" }}</a>
                <p class="text-truncate-2-lines margin-top-3">{{ .String "description" }}</p>
                <ul class="list-horizontal-text margin-top-3">
                  <li {{ .String "time_added" | parseRelativeTime "rfc3339" }}></li>
                  <li>{{ .String "author" }}</li>
                </ul>
              </li>
              {{ end }}
            </ul>
  
    - size: small
      widgets:
        - type: bookmarks
          title: Developer links
          groups:
            - title: Code
              color: 215 80 65
              links:
                - title: GitHub
                  url: ${GLANCE_GITHUB_URL}/
                  icon: si:github
                - title: Docker Hub
                  url: ${GLANCE_DOCKER_HUB_URL}/
                  icon: si:docker
                - title: Stack Overflow
                  url: ${GLANCE_STACK_OVERFLOW_URL}/
                  icon: si:stackoverflow
            - title: AI
              color: 288 65 64
              links:
                - title: ChatGPT
                  url: ${GLANCE_CHATGPT_URL}/
                  icon: si:openai
                - title: Hugging Face
                  url: ${GLANCE_HUGGING_FACE_URL}/
                  icon: si:huggingface
