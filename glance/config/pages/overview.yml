- name: Overview
  slug: overview
  width: wide
  show-mobile-header: true
  
  head-widgets:
    - type: search
      search-engine: ${HOMELAB_URL}:8088/search?q={QUERY}
      new-tab: true
      placeholder: Search with SearXNG…
      bangs:
        - title: YouTube
          shortcut: "!yt"
          url: https://www.youtube.com/results?search_query={QUERY}
        - title: GitHub
          shortcut: "!gh"
          url: https://github.com/search?q={QUERY}
        - title: Reddit
          shortcut: "!r"
          url: https://www.reddit.com/search/?q={QUERY}
  
  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 24h
  
        - type: weather
          location: Tunis, Tunisia
          units: metric
          hour-format: 24h
  
        - type: calendar
          first-day-of-week: monday
  
    - size: full
      widgets:
        - type: docker-containers
          title: Docker containers
          sock-path: tcp://docker-proxy:2375
          format-container-names: true
          containers:
            homarr:
              hide: true
            unbound:
              icon: sh:unbound
            archivist-es:
              name: Archivist Elasticsearch
              icon: sh:elasticsearch
