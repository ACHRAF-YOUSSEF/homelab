[package]
name = "jellyfin-counts-cache"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
bytes = "=1.12.1"
httparse = "=1.10.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "time", "sync", "signal", "macros", "io-util"] }
url = "=2.5.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
