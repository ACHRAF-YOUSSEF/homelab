[package]
name = "glance-live"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "glance-live"

[features]
default = []
fixture-probe = []

[[bin]]
name = "glance-live-probe"
path = "src/bin/glance-live-probe.rs"
required-features = ["fixture-probe"]

[dependencies]
async-stream = "=0.3.6"
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "time", "sync", "signal", "macros", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "=2.5.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
